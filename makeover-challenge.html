<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makeover Challenge</title>
<style>
  :root{--bg:#1b1230;--card:#2a1d47;--pink:#ff5fa2;--txt:#fff;--mut:#b9a9d9}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:440px;padding:16px;text-align:center}
  h1{margin:8px 0;font-size:24px;color:var(--pink)}
  .card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0}
  button{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;margin:6px 4px;cursor:pointer}
  button.sec{background:#443366}
  .ph{position:relative;width:100%;max-width:320px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;line-height:0}
  .ph img{width:100%;display:block}
  .ph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ff0;border:2px solid #000;pointer-events:none}
  .bar{height:8px;background:#443366;border-radius:8px;overflow:hidden;margin:10px 0}
  .bar>i{display:block;height:100%;background:var(--pink);width:100%}
  .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
  .sw.none{background:#443366}
  .sw.on{border-color:#fff;transform:scale(1.12)}
  .lbl{font-size:13px;color:var(--mut);text-align:left;margin-top:4px}
  .big{font-size:42px;margin:6px 0}
  .win{color:#6dffa8}.lose{color:#ff7b7b}
  .cmp{display:flex;gap:10px;justify-content:center}
  .cmp>div{flex:1;font-size:13px;color:var(--mut);line-height:1.3}
  .small{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>

  aspect: 0.8,
  lm: {eL:[0.375,0.373], eR:[0.583,0.351], m:[0.5,0.507]},   // left eye, right eye, mouth (0-1)
  target: {lip:0, eye:2, liner:0, blush:1, bindi:0, glasses:1}
};
/* ========================================== */

const $app = document.getElementById('app');
let cfg = DEFAULT_CFG, look = {}, timer = null;

/* ---- face landmarks se makeup overlay banata hai (kisi bhi photo par chalta hai) ---- */
function overlayInner(l, c){
  if(!c.lm) return '';
  const W = 1000, H = 1000 / c.aspect;
  const x1 = c.lm.eL[0]*W, y1 = c.lm.eL[1]*H, x2 = c.lm.eR[0]*W, y2 = c.lm.eR[1]*H;
  const ex = (x1+x2)/2, ey = (y1+y2)/2, dx = x2-x1, dy = y2-y1, d = Math.hypot(dx,dy);
  const th = Math.atan2(dy,dx), ang = th*180/Math.PI;
  const vx = c.lm.m[0]*W-ex, vy = c.lm.m[1]*H-ey;
  const my = (-vx*Math.sin(th) + vy*Math.cos(th)) / d;
  const mx = ( vx*Math.cos(th) + vy*Math.sin(th)) / d;
  const col = k => (l[k] >= 0 && l[k] != null) ? CATS[k].opts[l[k]][0] : null;
  let s = `<defs><filter id="b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".07"/></filter>
           <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".025"/></filter></defs>
           <g transform="translate(${ex} ${ey}) rotate(${ang}) scale(${d})">`;
  let v;
  if(v = col('blush')) s += [-1,1].map(sg=>`<ellipse cx="${sg*0.8}" cy="${my*0.62}" rx=".22" ry=".16" fill="${v}" opacity=".55" filter="url(#b1)"/>`).join('');
  if(v = col('eye'))   s += [-1,1].map(sg=>`<ellipse cx="${sg*0.5}" cy="-.08" rx=".27" ry=".11" fill="${v}" opacity=".7" filter="url(#b2)"/>`).join('');
  if(v = col('liner')) s += `<g fill="none" stroke="${v}" stroke-width=".035" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-.82 -.05 L-.75 .0 Q-.5 -.13 -.26 -.02"/><path d="M.82 -.05 L.75 .0 Q.5 -.13 .26 -.02"/></g>`;
  if(v = col('lip'))   s += `<path transform="translate(${mx} ${my})" d="M-.38 0 Q-.19 -.1 0 -.06 Q.19 -.1 .38 0 Q0 .2 -.38 0Z" fill="${v}" opacity=".72" filter="url(#b2)"/>`;
  if(v = col('bindi')) s += `<circle cx="0" cy="-.22" r=".04" fill="${v}"/>`;
  if(v = col('glasses')) s += `<g fill="rgba(255,255,255,.12)" stroke="${v}" stroke-width=".035" stroke-linejoin="round">
      <rect x="-.84" y="-.2" width=".66" height=".44" rx=".15"/><rect x=".18" y="-.2" width=".66" height=".44" rx=".15"/>
      <path fill="none" d="M-.18 -.05 Q0 -.12 .18 -.05 M-.84 -.05 L-1.0 -.1 M.84 -.05 L1.0 -.1"/></g>`;
  return s + '</g>';
}
function photo(l, c){
  c = c || cfg;
  return `<div class="ph"><img src="${c.img}"><svg viewBox="0 0 1000 ${1000/c.aspect}" preserveAspectRatio="none">${overlayInner(l,c)}</svg></div>`;
}

function show(html){ clearInterval(timer); $app.innerHTML = html; }

function menu(){
  show(`
  <h1>💄 Makeover Challenge</h1>
  <div class="card">
    <div class="ph" style="max-width:200px">${`<img src="${cfg.img}">`}</div>
    <p>Pehle model ka <b>makeup</b> dikhega (${MEMORIZE_SECONDS} sec). Fir wo gayab ho jayega.<br>
    Yaad se wahi makeover karo: lipstick, eyeshadow, eyeliner, blush, bindi, glasses.<br>
    Sab match hua to <b class="win">WIN</b>, warna <b class="lose">LOSE</b>!</p>
    <button onclick="memorize()">▶ Start Game</button>
  </div>`);
}

function memorize(){
  look = {}; KEYS.forEach(k=>look[k] = -1);
  show(`
  <h1>👀 Dhyan se dekho!</h1>
  <div class="card">${photo(cfg.target)}
    <div class="bar"><i id="b"></i></div>
    <div id="cd" style="font-size:34px">${MEMORIZE_SECONDS}</div>
    <button class="sec" onclick="play()">Ready ✔</button>
  </div>`);
  const b = document.getElementById('b'), cd = document.getElementById('cd'), t0 = Date.now();
  timer = setInterval(()=>{
    const left = Math.max(0, MEMORIZE_SECONDS-(Date.now()-t0)/1000);
    b.style.width = (left/MEMORIZE_SECONDS*100)+'%'; cd.textContent = Math.ceil(left);
    if(left <= 0) play();
  },100);
}

function play(){
  clearInterval(timer);
  show(`
  <h1>✨ Ab Makeover Karo!</h1>
  <div class="bar"><i id="b"></i></div>
  <div class="card">
    <div id="face">${photo(look)}</div>
    <div id="pick" style="margin-top:10px"></div>
    <button onclick="submit()">✅ Submit</button>
  </div>`);
  buildPicker(document.getElementById('pick'), look, ()=>document.getElementById('face').innerHTML = photo(look));
  const b = document.getElementById('b'), t0 = Date.now();
  timer = setInterval(()=>{
    const left = Math.max(0, PLAY_SECONDS-(Date.now()-t0)/1000);
    b.style.width = (left/PLAY_SECONDS*100)+'%';
    if(left <= 0) submit();
  },100);
}

function buildPicker(el, obj, onChange){
  el.innerHTML = KEYS.map(k=>`<div class="lbl">${CATS[k].label}</div><div class="row">
    <div class="sw none ${obj[k]===-1?'on':''}" data-k="${k}" data-i="-1" title="None">✖</div>`+
    CATS[k].opts.map((o,i)=>`<div class="sw ${obj[k]===i?'on':''}" data-k="${k}" data-i="${i}" style="background:${o[0]}" title="${o[1]}"></div>`).join('')+`</div>`).join('');
  el.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{
    obj[s.dataset.k] = +s.dataset.i; buildPicker(el,obj,onChange); onChange();
  });
}

function submit(){
  clearInterval(timer);
  const matched = KEYS.filter(k=>look[k] === cfg.target[k]);
  const win = matched.length >= NEED_MATCH;
  show(`
  <div class="big ${win?'win':'lose'}">${win?'🏆 WIN!':'💔 LOSE'}</div>
  <div class="card">
    <p>${matched.length}/${KEYS.length} cheezein match hui</p>
    <div class="cmp"><div>Tumhara${photo(look)}</div><div>Model${photo(cfg.target)}</div></div>
    <p class="small">${KEYS.map(k=>(look[k]===cfg.target[k]?'✅ ':'❌ ')+CATS[k].label.replace(/^\S+ /,'')).join(' &nbsp; ')}</p>
    <button onclick="memorize()">🔁 Phir Khelo</button>
    <button class="sec" onclick="menu()">🏠 Menu</button>
  </div>`);
}

menu();
</script>
